<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Gold Coast Arcade</title>

  <!-- PWA / "Add to Home Screen" support - the real, complete fix for the
       mobile browser's address bar eating screen space (not the letterbox
       bars, which are a separate aspect-ratio issue - see main.ts's
       Scale.FIT comment). Chrome/Android honor manifest.json's
       `"display": "standalone"` directly; iOS Safari ignores that field
       entirely and needs its own legacy apple-mobile-web-app-* meta tags
       instead - both are included since neither covers the other
       platform. Once added to the home screen, launching from that icon
       opens with ZERO browser chrome (no address bar, no tab strip) on
       either platform - nothing left to "auto-hide", so this sidesteps
       the vh/svh/dvh tradeoff entirely rather than trying to out-clever it. -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0e0f14" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gold Coast" />
  <link rel="icon" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #0e0f14;
      width: 100%;
      /* 100vh on mobile browsers is measured against the LARGEST possible
         viewport (as if the address bar/toolbar were hidden), not what's
         actually visible right now - so a 100vh-tall box can genuinely
         extend behind that chrome, physically hiding whatever sits at its
         bottom edge (reported live: the touch joystick's bottom got cut
         off, even though Scale.FIT itself was mathematically showing 100%
         of the canvas with zero cropping - a different bug than the
         ENVELOP crop this project hit earlier). 100svh ("small viewport
         height") is sized against the SMALLEST possible visible area -
         i.e. worst case, chrome fully shown - so content sized to it can
         never end up hidden behind chrome, in exchange for a few px of
         unused space at the bottom on browsers where the chrome auto-
         hides. Deliberately svh, not the newer dvh ("dynamic", tracks
         chrome showing/hiding live) - dvh would make the canvas keep
         resizing as the user scrolls/interacts, which is worse for a game
         than a few static px of margin. `100vh` stays first as a fallback
         for browsers that don't support either unit - the srh/dvh lines
         are simply ignored there, not applied on top. */
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      /* Mobile: prevent the page itself from scrolling/bouncing or the
         browser chrome swallowing touch gestures meant for the canvas
         (movement joystick, game buttons, etc.). */
      touch-action: none;
      overscroll-behavior: none;
    }
    #game-container {
      /* NOT display:flex/align-items/justify-content - this used to
         center its content that way, which seemed harmless (redundant
         with Phaser's own `autoCenter: CENTER_BOTH`) but actually broke
         the DOM Element overlay's positioning (LoginScene's real
         username/password <input>s): per the CSS Flexbox spec, an
         absolutely-positioned flex child's STATIC position is itself
         computed as centered, not top-left-origin - Phaser's internal
         margin/transform math for its DOM container div assumes a plain
         top-left-origin parent and doesn't account for that, so the two
         disagreed on where "centered" actually was. The canvas rendered
         fine regardless (Phaser sets its own explicit absolute position),
         which is why this only ever showed up as the inputs drifting away
         from the rest of the UI, confirmed live on a real phone. Leave
         centering entirely to Phaser's own Scale Manager - this container
         just needs to fill the viewport as a plain block.
         `position: relative` gives Phaser's own absolutely-positioned
         canvas/DOM-container children a sane containing block. */
      position: relative;
      width: 100vw;
      height: 100vh; /* fallback - see html,body's height rule above for why 100svh */
      height: 100svh;
      /* Belt-and-suspenders against page scrollbars - Scale.FIT (main.ts)
         shouldn't ever overflow this container, but doesn't hurt to clip
         defensively. */
      overflow: hidden;
    }
    #game-container canvas {
      image-rendering: pixelated;
    }

    /* Landscape-locked mobile support: the whole game is laid out for a
       wide landscape canvas (see main.ts's 800x600 Scale.FIT config), so a
       phone held upright would show it squeezed tiny in the middle of the
       screen rather than a real "not supported" state. This overlay covers
       the game and asks for a rotate instead, matching the user-confirmed
       "lock to landscape" approach over a full portrait redesign.
       Deliberately gated on BOTH orientation AND a phone-sized viewport
       (max-width) - a desktop window resized narrow+tall shouldn't trigger
       this, only an actual small/mobile screen held upright. */
    #rotate-prompt {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #0e0f14;
      color: #f5f6fa;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    #rotate-prompt .icon {
      font-size: 56px;
      margin-bottom: 16px;
      animation: rotate-hint 1.6s ease-in-out infinite;
    }
    #rotate-prompt .title {
      font-size: 18px;
      font-weight: bold;
      color: #ff8a3d;
      margin-bottom: 8px;
    }
    #rotate-prompt .subtitle {
      font-size: 13px;
      color: #9aa3bd;
      max-width: 280px;
    }
    @keyframes rotate-hint {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-90deg); }
    }
    /* Fullscreen toggle - hides browser chrome (address bar, tab strip)
       where the browser's Fullscreen API supports it. Wired up from
       main.ts (checks `game.scale.fullscreen.available` and hides this
       button entirely where it isn't supported - notably iOS Safari,
       which doesn't allow arbitrary elements to go fullscreen at all, so
       it won't appear there no matter where it's positioned - not a bug
       if it's missing specifically on an iPhone). Sits above the game
       (z-index) but below #rotate-prompt, so it's naturally covered while
       that's showing rather than needing its own orientation media query.
       Top-LEFT (moved from top-right per user report of not spotting it
       there - top-left reads first on a landscape phone, closer to where
       a thumb already rests near the touch joystick). */
    #fullscreen-btn {
      display: none;
      position: fixed;
      /* env(safe-area-inset-*) - a landscape iPhone's camera cutout/rounded
         corner can sit exactly in a fixed screen corner; the fallback 10px
         keeps the old position on every browser that doesn't define the
         env() (everything except notched iOS Safari, which is the one
         case this actually matters for). Requires viewport-fit=cover in
         the viewport meta tag above to have any value at all - without it
         these env() vars are always 0. */
      top: calc(env(safe-area-inset-top, 0px) + 10px);
      left: calc(env(safe-area-inset-left, 0px) + 10px);
      z-index: 500;
      width: 42px;
      height: 42px;
      border-radius: 8px;
      /* Orange accent border/tint (Theme.accent, matches the app icon's
         ring) instead of the original muted steel-blue - the low-contrast
         version blended into the game's own dark chrome enough that it
         went unspotted; this reads as a distinct, brand-colored control. */
      border: 2px solid #ff7a29;
      background: rgba(26, 33, 56, 0.95);
      color: #f5f6fa;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    }
    #fullscreen-btn:active {
      background: rgba(255, 122, 41, 0.3);
    }
    @media (orientation: portrait) and (max-width: 900px) {
      #rotate-prompt { display: flex; }
      /* visibility:hidden, NOT display:none - the actual bug this was
         fixing: `display:none` collapses #game-container to a 0x0 box, and
         most phones load the page in portrait FIRST (before ever
         rotating), so Phaser boots and computes its DOM Element overlay's
         position/scale (the login username/password <input>s) against
         that zero-size box. Rotating to landscape resized the canvas
         correctly (Scale.FIT catches the resize) but the DOM container's
         position math had already latched onto the bad initial geometry
         and didn't fully recompute - reported live as "the inputs aren't
         under the sign in/up button" after rotating on a real phone.
         visibility:hidden keeps the container at its real 100vw/100vh
         layout size the whole time (just not painted), so Phaser always
         measures real geometry, in either orientation, from the very
         first frame. pointer-events:none is redundant with
         visibility:hidden (which already blocks hit-testing) but kept
         explicit as a second guard against stray input reaching a
         not-actually-visible canvas. */
      #game-container { visibility: hidden; pointer-events: none; }
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <button id="fullscreen-btn" type="button" aria-label="Toggle fullscreen">⛶</button>
  <div id="rotate-prompt">
    <div class="icon">📱</div>
    <div class="title">Rotate your device</div>
    <div class="subtitle">Gold Coast Arcade plays in landscape - turn your phone sideways to continue.</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
