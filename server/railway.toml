# Railway service config for casino-poc's server. See DEPLOYMENT.md for the
# full walkthrough (creating the Railway project, provisioning Postgres,
# setting variables, connecting this repo, deploying).
#
# This file only configures the build/deploy behavior - it does NOT and
# cannot provision any account or cloud resource; that's done by the human
# user in the Railway dashboard/CLI per DEPLOYMENT.md.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Railway's startCommand (when set) overrides the Dockerfile's CMD entirely,
# so this repeats it explicitly rather than relying on the Dockerfile alone
# - keeps behavior identical whichever one Railway actually uses. See the
# Dockerfile's CMD comment for the full history of why `prisma migrate
# deploy` was removed from container start entirely (three different
# invocation strategies all failed on Railway specifically, most likely an
# OOM kill from two Node-based processes starting concurrently) - migrations
# now run as a decoupled step, see DEPLOYMENT.md's "Ongoing: running a new
# migration".
startCommand = "node dist/index.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
healthcheckPath = "/health"
healthcheckTimeout = 30
