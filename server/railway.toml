# Railway service config for casino-poc's server. See DEPLOYMENT.md for the
# full walkthrough (creating the Railway project, provisioning Postgres,
# setting variables, connecting this repo, deploying).
#
# This file only configures the build/deploy behavior - it does NOT and
# cannot provision any account or cloud resource; that's done by the human
# user in the Railway dashboard/CLI per DEPLOYMENT.md.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Railway's startCommand (when set) overrides the Dockerfile's CMD entirely,
# so this repeats the same sequence explicitly rather than relying on the
# Dockerfile alone - keeps behavior identical whichever one Railway
# actually uses. See the Dockerfile's CMD comment for the full history -
# backgrounding prisma with `&` *still* produced a silent deploy log with
# zero server output, ruling out prisma's process lifecycle as the cause
# entirely. These bare `echo` markers need zero Node/TypeScript/Prisma to
# produce output - they tell us whether the shell itself ever reaches the
# point of launching node at all.
startCommand = "echo '>>> BOOT-A: shell entered CMD'; ./node_modules/.bin/prisma migrate deploy & echo '>>> BOOT-B: migrate backgrounded, about to exec node'; exec node dist/index.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
healthcheckPath = "/health"
healthcheckTimeout = 30
